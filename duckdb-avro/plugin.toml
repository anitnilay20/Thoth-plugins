id          = "com.thoth.duckdb-avro"
name        = "Avro Reader"
version     = "1.0.0"
description = "Open Avro container files as tables you can query."
author      = "Thoth contributors"
homepage    = "https://github.com/anitnilay20/Thoth-plugins/tree/main/duckdb-avro"
icon        = ""    # egui_phosphor::regular::BINARY

capabilities = ["duckdb-extension"]

# This plugin ships no binary of its own. DuckDB already hosts the `avro`
# extension for every platform it supports, keyed by its own version, and picks
# the right build itself — so the plugin declares the reader and the engine
# fetches it. Carrying the `.duckdb_extension` files here would mean owning that
# whole matrix by hand and re-uploading it on every DuckDB release.
[duckdb-extension]
extension            = "avro"
repository           = "core"
supported-extensions = ["avro"]
unlocks              = "Avro container files (.avro)"
download-size        = "7.5 MB"
