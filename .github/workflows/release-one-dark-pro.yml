name: Release · one-dark-pro

on:
  push:
    tags:
      - "one-dark-pro-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.0)"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#one-dark-pro-v}"
          else
            VERSION="${{ inputs.version }}"
            TAG="one-dark-pro-v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}"         >> "$GITHUB_OUTPUT"

      - name: Package plugin
        run: |
          zip -j one-dark-pro.zip \
            one-dark-pro/plugin.toml \
            one-dark-pro/theme.json \
            one-dark-pro/README.md

      - name: Compute SHA-256
        id: sha256
        run: echo "hash=$(sha256sum one-dark-pro.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Update manifest.toml
        run: |
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag }}/one-dark-pro.zip"
          sed -i "s|^download_url = .*|download_url = \"${DOWNLOAD_URL}\"|" manifest.toml
          sed -i "s|^sha256 = .*|sha256 = \"${{ steps.sha256.outputs.hash }}\"|" manifest.toml

      - name: Commit updated manifest
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.toml
          git diff --cached --quiet || git commit -m "chore: update one-dark-pro manifest for v${{ steps.meta.outputs.version }}"
          git push origin HEAD:main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "One Dark Pro v${{ steps.meta.outputs.version }}"
          body: |
            ## One Dark Pro v${{ steps.meta.outputs.version }}

            One Dark Pro colour scheme for Thoth.

            **SHA-256:** `${{ steps.sha256.outputs.hash }}`

            ### Installation
            1. Download `one-dark-pro.zip` below.
            2. Extract and copy the folder to your plugins directory:
               - **macOS / Linux:** `~/.config/thoth/plugins/`
               - **Windows:** `%APPDATA%\thoth\plugins\`
            3. Restart Thoth and enable the theme under **Settings → Appearance → Theme**.
          files: one-dark-pro.zip
