name: Release · one-dark-pro

on:
  push:
    tags:
      - "one-dark-pro-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.0)"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: one-dark-pro
          fetch-depth: 0

      - name: Resolve version and tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#one-dark-pro-v}"
          else
            VERSION="${{ inputs.version }}"
            TAG="one-dark-pro-v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}"         >> "$GITHUB_OUTPUT"

      - name: Package plugin
        run: |
          zip -j one-dark-pro.zip \
            one-dark-pro/plugin.toml \
            one-dark-pro/theme.json \
            one-dark-pro/icon.png \
            one-dark-pro/README.md

      - name: Compute SHA-256
        id: sha256
        run: echo "hash=$(sha256sum one-dark-pro.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Update manifest.toml
        run: |
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag }}/one-dark-pro.zip"
          python3 - "$DOWNLOAD_URL" "${{ steps.sha256.outputs.hash }}" "${{ steps.meta.outputs.version }}" <<'EOF'
          import sys

          plugin_id   = "com.thoth.one-dark-pro"
          download_url, sha256, version = sys.argv[1], sys.argv[2], sys.argv[3]
          updates = {"download_url": download_url, "sha256": sha256, "version": version}

          with open("manifest.toml") as f:
              lines = f.readlines()

          in_section = False
          out = []
          for line in lines:
              stripped = line.strip()
              if stripped.startswith("["):
                  in_section = stripped == f'["{plugin_id}"]'
              if in_section:
                  for key, val in updates.items():
                      if stripped.startswith(f"{key} ="):
                          line = f'{key} = "{val}"\n'
                          break
              out.append(line)

          with open("manifest.toml", "w") as f:
              f.writelines(out)
          EOF

      - name: Commit updated manifest
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.toml
          git diff --cached --quiet || git commit -m "chore: update one-dark-pro manifest for v${{ steps.meta.outputs.version }}"
          git push origin HEAD:one-dark-pro

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "One Dark Pro v${{ steps.meta.outputs.version }}"
          body: |
            ## One Dark Pro v${{ steps.meta.outputs.version }}

            One Dark Pro colour scheme for Thoth.

            **SHA-256:** `${{ steps.sha256.outputs.hash }}`

            ### Installation
            1. Download `one-dark-pro.zip` below.
            2. Extract and copy the folder to your plugins directory:
               - **macOS:** `~/Library/Application Support/thoth`
               - **Linux:** `~/.config/thoth/plugins/`
               - **Windows:** `%APPDATA%\thoth\plugins\`
            3. Restart Thoth and enable the theme under **Settings → Appearance → Theme**.
          files: one-dark-pro.zip
