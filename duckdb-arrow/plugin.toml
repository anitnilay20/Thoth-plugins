id          = "com.thoth.duckdb-arrow"
name        = "Arrow Reader"
version     = "1.0.0"
description = "Open Arrow IPC streams and feather files."
author      = "Thoth contributors"
homepage    = "https://github.com/anitnilay20/Thoth-plugins/tree/main/duckdb-arrow"
icon        = "\uE2DE"    # egui_phosphor::regular::LIGHTNING

capabilities = ["duckdb-extension"]

# This plugin ships no binary of its own. DuckDB already hosts the `arrow`
# extension for every platform it supports, keyed by its own version, and picks
# the right build itself — so the plugin declares the reader and the engine
# fetches it. Carrying the `.duckdb_extension` files here would mean owning that
# whole matrix by hand and re-uploading it on every DuckDB release.
[duckdb-extension]
extension            = "arrow"
repository           = "community"
supported-extensions = ["arrow", "arrows", "ipc"]
unlocks              = "Arrow IPC streams (.arrow, .arrows, .ipc)"
download-size        = "2 MB"
